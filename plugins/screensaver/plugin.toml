# A plugin is one folder holding this file and the plugin's built code.
id = "pyroporch.screensaver"
name = "Screen Saver"
version = "0.3.0"
description = "Animations on the keys, started by a key press or after a quiet spell."
wasm = "plugin.wasm"

[permissions]
http_hosts = []
secrets = []
# Lets it play on the keys and change how bright the deck is.
deck = true
