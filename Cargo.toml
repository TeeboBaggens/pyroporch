# Versions below are the latest stable releases on crates.io, checked 2026-11-03.
# (Rust itself: 1.99.1, the latest stable, also checked 2026-11-03.)
[workspace]
members = [".", "crates/sdk", "crates/core", "crates/desktop", "plugins/_examples/api-call", "plugins/_examples/screensaver"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
pyroporch-sdk = { path = "crates/sdk" }
pyroporch-core = { path = "crates/core" }
pyroporch-desktop = { path = "crates/desktop" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[package]
name = "pyroporch"
description = "A lean, secure, config-driven button deck with plugins and a built-in MCP server."
version.workspace = true
edition.workspace = true
license.workspace = true

# Everything optional is a module you can leave out, e.g.
#   cargo build --no-default-features --features desktop-actions
[features]
default = ["desktop-actions", "hardware", "os-keychain"]
desktop-actions = ["dep:pyroporch-desktop"]
hardware = ["dep:elgato-streamdeck", "dep:ab_glyph", "dep:epaint_default_fonts"]
os-keychain = ["pyroporch-core/os-keychain"]

[dependencies]
pyroporch-sdk.workspace = true
pyroporch-core.workspace = true
pyroporch-desktop = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
# File pickers for pictures and config files.
rfd = "0.17.2"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# Only here to switch on the icon font used on the keys.
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
zeroize = "1.9.1"
elgato-streamdeck = { version = "0.14.0", optional = true }
ab_glyph = { version = "0.2.32", optional = true }
epaint_default_fonts = { version = "0.37.0", optional = true, features = ["monochrome_emoji_fonts"] }

# The menu bar or tray item. Linux would need all of GTK for it, so it goes without.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSResponder", "NSRunningApplication"] }

[dev-dependencies]
egui_kittest = "0.37.0"
tempfile = "3.27.0"

# Key derivation is painfully slow without optimisation, even in a debug build.
[profile.dev.package.argon2]
opt-level = 3
# Plugins run in the sandbox, and a screen saver redraws many times a second, which needs these
# faster too. Not at 3: with wasmi 2.0.0 that crashes on Windows when a plugin calls the app, while
# the rest is unoptimised (https://github.com/wasmi-labs/wasmi/issues/2061). Release builds are fine.
[profile.dev.package.wasmi]
opt-level = 1
[profile.dev.package.wasmi_core]
opt-level = 1
[profile.dev.package.wasmi_ir]
opt-level = 1
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.elgato-streamdeck]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "abort"
codegen-units = 4
