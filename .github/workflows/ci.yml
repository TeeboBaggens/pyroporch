# Builds and tests on all three platforms. Rust itself comes from rust-toolchain.toml.
name: CI

# Skips changes that can't affect the app. The guides in docs/ and plugins/README.md still run this,
# because they're built into the app and tests check them against it.
on:
  push:
    branches: [main]
    paths-ignore: &not-the-app
      - README.md
      - LICENSE-*
      - .gitignore
      - .github/workflows/codeql.yml
      - .github/workflows/release.yml
  pull_request:
    paths-ignore: *not-the-app

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # checkout 7.0.1 and rust-cache 2.9.3: the latest stable releases, checked 2026-11-03.
      - uses: actions/checkout@v7.0.1
      - name: Install the system's development packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev libx11-dev libwayland-dev libgl1-mesa-dev
      - name: Install the pinned Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
